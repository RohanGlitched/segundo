# Segundo keeper: CRE workflow settings.
# staging-settings is used for `cre workflow simulate` (MockKeystoneForwarder on Monad testnet).
# production-settings is for a deployed workflow (KeystoneForwarder on Monad testnet).

staging-settings:
  user-workflow:
    workflow-name: "segundo-keeper-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "segundo-keeper"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
